# Static hosting of the MountainNotes web app (www/), published over HTTPS by Tailscale Funnel.

# Hashed bundles never change: cache them for a year. Everything else (index.html, ngsw.json,
# service worker, manifest, assets) is revalidated, so updates arrive.
map $uri $cache_control {
  ~^/(chunk|main|polyfills|styles)-[^/]+\.(js|css)$  "public, max-age=31536000, immutable";
  default                                            "no-cache";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Set here only (a location with its own add_header would drop all of these).
  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # Single-page app: unknown paths (e.g. /tabs/map after a reload) get index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
